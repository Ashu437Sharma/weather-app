<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link href="style.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
</head>
<body>
    <div class="main">
        <div class="box">
            <div class="inp">
                <input type="text" placeholder="Enter a city">
                <button><span class="material-symbols-outlined">
search
</span></button>
            </div>
            <div class="icon">
                <img src="">
            </div>
            
                <div class="data">
                    <div class="temp">
                        <span class="material-symbols-outlined">
thermometer
</span>
                        <span class="span1"></i>Temprature:</span>
                        <span class="magni one" style="color: orange;"></span>
                        
                    </div>
                     <div class="temp">
                        <span class="material-symbols-outlined">
water_drop
</span>
                        <span class="span1"></i>Humidity:</span>
                        <span class="magni two" style="color: cyan;"></span>
                        
                    </div>
                     
                     <div class="temp">
                        <span class="material-symbols-outlined">
airwave
</span>
                        <span class="span1"></i>Wind Speed:</span>
                        <span class="magni three" style="color: lightgreen;"></span>
                        
                    </div>
                    <div class="temp">
                        <span class="material-symbols-outlined">
cloud
</span>
                        <span class="span1"></i>Condition:</span>
                        <span class="magni four" style="color: yellow;"></span>
                        
                    </div>
                    <div class="temp">
                        <span class="material-symbols-outlined">
location_on
</span>
                        <span class="span1"></i>Country:</span>
                        <span class="magni five" style="color: white;"></span>
                        
                    </div>

                </div>
                
            
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
